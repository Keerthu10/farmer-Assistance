    <script>
      // Intercept and cleanly handle harmless WebSocket reconnection rejections in sandboxed preview environments
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason && (event.reason.message || String(event.reason));
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
